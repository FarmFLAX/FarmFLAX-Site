<!doctype html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your cart · FarmFLAX</title>
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
</head>
<body>
<div id="ff-header"></div>
<main class="wrap page">
  <h1>Your cart</h1>
  <div id="cart"><p class="muted">Loading…</p></div>
</main>
<div id="ff-footer"></div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var box = document.getElementById("cart"), products = [];
  function render() {
    var lines = FF.cartLines(products), t = FF.totals(lines);
    if (!lines.length) {
      box.innerHTML = '<div class="empty"><p>Your cart is empty.</p><a class="btn btn-primary" href="index.html#shop">Browse products</a></div>';
      return;
    }
    var left = FF_CONFIG.freeShippingAbove - t.subtotal;
    box.innerHTML = '<div class="two-col"><div>' + lines.map(function (l) {
      var p = l.product;
      return '<div class="line"><img src="' + FF.esc(p.images[0]) + '" alt="">' +
        '<div><div class="name">' + FF.esc(p.name) + '</div><div class="unit">' + FF.money(p.price) + ' · ' + p.weight + ' g</div>' +
        '<div class="qty" style="margin-top:8px"><button type="button" data-dec="' + p.id + '" aria-label="Decrease ' + FF.esc(p.name) + '">−</button><output>' + l.qty + '</output><button type="button" data-inc="' + p.id + '" aria-label="Increase ' + FF.esc(p.name) + '">+</button></div></div>' +
        '<div class="right"><b>' + FF.money(l.total) + '</b><button class="remove" type="button" data-rm="' + p.id + '">Remove</button></div></div>';
    }).join("") + '</div>' +
      '<aside class="summary" aria-label="Order summary"><div class="row"><span>Subtotal</span><span>' + FF.money(t.subtotal) + '</span></div>' +
      '<div class="row"><span>Delivery</span><span>' + (t.shipping ? FF.money(t.shipping) : "Free") + '</span></div>' +
      (left > 0 ? '<div class="note">Add ' + FF.money(left) + ' more for free delivery.</div>' : '<div class="note">You get free delivery.</div>') +
      '<div class="row total"><span>Total</span><span>' + FF.money(t.total) + '</span></div>' +
      '<a class="btn btn-primary btn-block" href="checkout.html">Checkout</a></aside></div>';
  }
  FF.loadProducts().then(function (ps) { products = ps; render(); })
    .catch(function () { box.innerHTML = '<p class="err">Your cart could not be loaded. Please refresh the page.</p>'; });
  box.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var c = FF.readCart();
    if (b.dataset.inc) FF.setQty(b.dataset.inc, (c[b.dataset.inc] || 0) + 1);
    else if (b.dataset.dec) FF.setQty(b.dataset.dec, (c[b.dataset.dec] || 0) - 1);
    else if (b.dataset.rm) FF.setQty(b.dataset.rm, 0);
    render();
  });
});
</script>
</body>
</html>
